<!doctype html>
<html lang="zh-TW">
    <head>
        <meta charset="UTF-8">
        <title>AR.js 整合 3D、影片與圖片</title>
        <!-- 引入 A-Frame 與 AR.js 核心庫 -->
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <!-- 引入 A-Frame Extras 以支援 3D 動畫 -->
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <!-- 引入手勢控制庫 -->
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
        
        <!-- 影片播放控制器：偵測到 marker 時播放，失去時暫停 -->
        <script>
            AFRAME.registerComponent('videohandler', {
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector("#vid");

                    marker.addEventListener('markerFound', function () {
                        this.toggle = true;
                        this.vid.play();
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        this.toggle = false;
                        this.vid.pause();
                    }.bind(this));
                },
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <!-- 設定 AR 場景 -->
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <!-- 資源預載區 -->
            <a-assets>
                <!-- 3D模型 -->
                <a-asset-item id="model-asset" src="assets/asset.glb"></a-asset-item>
                <!-- 影片 -->
                <video id="vid" src="assets/asset.mp4" preload="auto" response-type="arraybuffer" loop crossorigin webkit-playsinline autoplay muted playsinline></video>
                <!-- 圖片 -->
                <img id="img-asset" src="assets/asset.png">
            </a-assets>

            <!-- 辨識圖設定 -->
            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                videohandler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <!-- 1. 3D模型實體 (放置於中央偏上) -->
                <a-entity
                    id="bowser-model"
                    scale="0.2 0.2 0.2"
                    position="0 0.5 0"
                    animation-mixer="loop: repeat"
                    gltf-model="#model-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>

                <!-- 2. 影片實體 (放置於右側) -->
                <a-video
                    src="#vid"
                    scale="1 1 1"
                    position="1.2 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>

                <!-- 3. 圖片實體 (放置於左側) -->
                <a-image
                    src="#img-asset"
                    scale="1 1 1"
                    position="-1.2 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-image>
            </a-marker>

            <!-- 攝影機 -->
            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
